<!DOCTYPE html>
<html>
<head>
    <title>3D Airplane Shooter</title>
    <style>
        body { margin: 0; }
        canvas { display: block; }
    </style>
    <script async src="https://unpkg.com/es-module-shims@1.6.3/dist/es-module-shims.js"></script>
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.150.1/build/three.module.js"
        }
    }
    </script>
</head>
<body>
    <div id="scoreDisplay" style="position: absolute; top: 10px; left: 10px; color: white; font-size: 24px; font-family: Arial, sans-serif;">Score: 0</div>
    <div id="gameOverDisplay" style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: red; font-size: 48px; font-family: Arial, sans-serif; display: none; text-align: center;">
        Game Over
    </div>
    <script type="module" src="main.js"></script>

</html>
